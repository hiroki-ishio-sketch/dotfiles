# キーボードを最後に操作してから15分経つと、Bluetooth接続を切ってディープスリープする。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 元のToraboと同じ機器番号を使い、Karabinerのキー一覧がUSBでもBluetoothでも機種を判定できるようにする。
CONFIG_ZMK_KEYBOARD_NAME="Torabo-tsuki S"
CONFIG_USB_DEVICE_VID=0xFEED
CONFIG_USB_DEVICE_PID=0xBCAD
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0xFEED
CONFIG_BT_DIS_PNP_PID=0xBCAD

# 現在の実機と同じカーソル分解能と、自動でマウスレイヤーから戻るまでの時間を使う。
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=664
