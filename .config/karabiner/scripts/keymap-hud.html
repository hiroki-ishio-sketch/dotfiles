<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Keymap Layers · JIS</title>
  <style>
    /* Gruvbox Material (dark medium) */
    :root {
      --bg0: #1d2021;
      --bg1: #282828;
      --bg2: #32302f;
      --bg3: #45403d;
      --bg4: #5a524c;
      --fg0: #d4be98;
      --fg1: #ddc7a1;
      --grey0: #7c6f64;
      --grey1: #928374;
      --grey2: #a89984;
      --red: #ea6962;
      --orange: #e78a4e;
      --yellow: #d8a657;
      --green: #a9b665;
      --aqua: #89b482;
      --blue: #7daea3;
      --purple: #d3869b;
      --unit: 42px;
      --gap: 5px;
      --key-h: 40px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: transparent !important;
      width: max-content;
    }
    body {
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif;
      color: var(--fg0);
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      margin: 0;
      padding: 20px 22px 16px;
      background: linear-gradient(
        180deg,
        rgba(40, 40, 40, 0.82) 0%,
        rgba(29, 32, 33, 0.78) 100%
      );
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid rgba(212, 190, 152, 0.12);
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(212,190,152,0.08);
      min-width: 1000px;
      width: max-content;
      opacity: 0;
      transform: translateY(8px) scale(0.985);
      animation: rise 160ms ease-out forwards;
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 19px;
      letter-spacing: 0.01em;
      color: var(--yellow);
      font-weight: 700;
    }
    .sub { color: var(--grey1); font-size: 12px; }
    .layers { display: grid; gap: 14px; }
    .board {
      background: rgba(50, 48, 47, 0.55);
      border: 1px solid rgba(60, 56, 54, 0.8);
      border-radius: 14px;
      padding: 12px 14px 14px;
      box-shadow: inset 0 1px 0 rgba(212,190,152,0.04);
    }
    .board.active {
      border-color: rgba(216, 166, 87, 0.45);
      box-shadow: inset 0 0 0 1px rgba(216, 166, 87, 0.12), inset 0 1px 0 rgba(212,190,152,0.04);
    }
    .board-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .board-title { font-size: 14px; font-weight: 700; color: var(--fg1); }
    .board.active .board-title { color: var(--yellow); }
    .board-summary {
      color: var(--grey1);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: right;
    }
    .keyboard {
      display: grid;
      gap: var(--gap);
      justify-content: center;
      padding: 2px 0 4px;
      position: relative;
    }
    .row {
      display: flex;
      gap: var(--gap);
      justify-content: flex-start;
      align-items: flex-start;
      min-height: var(--key-h);
      height: var(--key-h);
    }
    .key {
      position: relative;
      height: var(--key-h);
      width: var(--unit);
      padding: 3px 4px 4px;
      border-radius: 7px;
      background: linear-gradient(180deg, #45403d 0%, #3c3836 100%);
      border: 1px solid #1d2021;
      box-shadow: inset 0 1px 0 rgba(212,190,152,0.1), 0 1px 2px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 650;
      font-size: 12px;
      color: var(--fg0);
      flex: 0 0 auto;
      overflow: hidden;
    }
    .key.holder {
      background: linear-gradient(180deg, #c35e0a 0%, #a04300 100%);
      border-color: rgba(231, 138, 78, 0.45);
      color: #1d2021;
    }
    .key.mapped {
      background: linear-gradient(180deg, #6f8250 0%, #556340 100%);
      border-color: rgba(169, 182, 101, 0.4);
      color: #1d2021;
    }
    .key .shift {
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 9px;
      font-weight: 600;
      color: var(--grey2);
      opacity: 0.95;
    }
    .key.holder .shift,
    .key.mapped .shift { color: rgba(29,32,33,0.7); }
    .key .base {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .key .action {
      color: var(--bg0);
      font-size: 11px;
      font-weight: 750;
      margin-top: 1px;
    }
    .key .kana {
      position: absolute;
      left: 5px;
      bottom: 3px;
      font-size: 9px;
      font-weight: 500;
      color: var(--grey1);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    }
    .key.holder .kana,
    .key.mapped .kana { color: rgba(29,32,33,0.65); }
    .key.mod {
      font-size: 10px;
      color: var(--grey2);
    }
    /*
      Apple 公式 JIS return（258×340 px 実測）:
      上段フル幅、下段は左 ~19% 欠け。巨大なせり出しはしない。
    */
    .key.jis-return {
      width: calc(var(--unit) * 1.72);
      height: calc(var(--key-h) * 2 + var(--gap));
      margin-bottom: calc(-1 * (var(--key-h) + var(--gap)));
      background: transparent;
      border: none;
      box-shadow: none;
      overflow: visible;
      z-index: 1;
      padding: 0;
    }
    .key.jis-return .return-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.45));
      overflow: visible;
    }
    .key.jis-return .glyph {
      position: absolute;
      right: 11px;
      top: 10px;
      z-index: 2;
      font-size: 14px;
      font-weight: 500;
      color: var(--fg0);
      line-height: 1;
      pointer-events: none;
    }
    .key.jis-return .word {
      position: absolute;
      right: 10px;
      bottom: 9px;
      z-index: 2;
      font-size: 9px;
      font-weight: 650;
      color: var(--grey2);
      letter-spacing: 0.02em;
      pointer-events: none;
    }
    .key.bracket-close {
      z-index: 3;
      position: relative;
    }
    .arrows {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      width: calc(var(--unit) * 3.05);
      height: var(--key-h);
    }
    .arrows .ak {
      border-radius: 5px;
      background: linear-gradient(180deg, #45403d 0%, #3c3836 100%);
      border: 1px solid #1d2021;
      box-shadow: inset 0 1px 0 rgba(212,190,152,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg0);
      font-size: 9px;
      font-weight: 700;
    }
    .arrows .up { grid-column: 2; grid-row: 1; }
    .arrows .left { grid-column: 1; grid-row: 2; }
    .arrows .down { grid-column: 2; grid-row: 2; }
    .arrows .right { grid-column: 3; grid-row: 2; }
    .legend {
      margin-top: 10px;
      display: flex;
      gap: 14px;
      justify-content: flex-end;
      color: var(--grey1);
      font-size: 11px;
    }
    .swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -1px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
    }
    .swatch.holder { background: #a04300; }
    .swatch.mapped { background: #556340; }
    .swatch.normal { background: #3c3836; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <h1>Keymap Layers · JIS shape / US legends</h1>
      <div class="sub">f + b で表示 · 離すと閉じる · Gruvbox Material</div>
    </div>
    <div class="layers" id="layers"></div>
  </div>
  <script>
    function widthStyle(units) {
      return `width: calc(var(--unit) * ${Number(units || 1)});`;
    }

    function displayName(key, def) {
      return (def.key_labels && def.key_labels[key]) || key;
    }

    function createArrowCluster() {
      const wrap = document.createElement("div");
      wrap.className = "arrows";
      wrap.innerHTML = `
        <div class="ak up">▲</div>
        <div class="ak left">◀</div>
        <div class="ak down">▼</div>
        <div class="ak right">▶</div>
      `;
      return wrap;
    }

    function createKey(key, layer, def, options = {}) {
      if (key === "arrow_cluster") return createArrowCluster();

      const bindings = layer.bindings || {};
      const mapped = bindings[key];
      const keyEl = document.createElement("div");
      keyEl.className = "key";
      keyEl.style.cssText = widthStyle((def.key_widths && def.key_widths[key]) || 1);
      if (options.jisReturn) keyEl.classList.add("jis-return");
      if (key === "]") keyEl.classList.add("bracket-close");
      if (key === "space") keyEl.classList.add("space");
      if (key === "f" && layer.id === "f") keyEl.classList.add("holder");
      if (mapped) keyEl.classList.add("mapped");

      const mods = new Set([
        "esc", "delete", "tab", "control", "shift_l", "shift_r", "return",
        "caps", "option_l", "option_r", "command_l", "command_r",
        "eisuu", "kana", "fn", "space"
      ]);
      if (mods.has(key)) keyEl.classList.add("mod");

      const shift = def.shift_labels && def.shift_labels[key];
      if (shift) {
        const shiftEl = document.createElement("div");
        shiftEl.className = "shift";
        shiftEl.textContent = shift;
        keyEl.appendChild(shiftEl);
      }

      const glyph = def.key_glyphs && def.key_glyphs[key];
      if (options.jisReturn) {
        // Apple JIS return: top full-width, bottom left inset ~19% (official asset ratio).
        const gid = `retGrad-${layer.id}-${Math.random().toString(36).slice(2, 7)}`;
        keyEl.innerHTML = `
          <svg class="return-svg" viewBox="0 0 100 132" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#45403d"/>
                <stop offset="100%" stop-color="#3c3836"/>
              </linearGradient>
            </defs>
            <path fill="url(#${gid})" stroke="#1d2021" stroke-width="1.2" stroke-linejoin="round"
              d="M 5.5 1
                 H 94.5
                 Q 99 1 99 5.5
                 V 126.5
                 Q 99 131 94.5 131
                 H 24
                 Q 19 131 19 126.5
                 V 66
                 H 5.5
                 Q 1 66 1 61.5
                 V 5.5
                 Q 1 1 5.5 1
                 Z"/>
            <path fill="none" stroke="rgba(212,190,152,0.14)" stroke-width="1"
              d="M 6 2.2 H 94 Q 97.5 2.2 97.5 5.5 V 8"/>
          </svg>`;
        const g = document.createElement("div");
        g.className = "glyph";
        g.textContent = glyph || "↩";
        const w = document.createElement("div");
        w.className = "word";
        w.textContent = "return";
        keyEl.appendChild(g);
        keyEl.appendChild(w);
        return keyEl;
      }

      if (mapped) {
        const base = document.createElement("div");
        base.className = "base";
        base.textContent = displayName(key, def);
        const action = document.createElement("div");
        action.className = "action";
        action.textContent = mapped;
        keyEl.appendChild(base);
        keyEl.appendChild(action);
      } else if (key !== "space") {
        const name = displayName(key, def);
        if (!name && !glyph) {
          keyEl.style.visibility = "hidden";
          return keyEl;
        }
        const label = document.createElement("div");
        if (glyph && key !== "eisuu" && key !== "kana" && key !== "fn") {
          label.textContent = `${glyph} ${name}`;
          label.style.fontSize = "10px";
        } else {
          label.textContent = name;
        }
        keyEl.appendChild(label);
      }
      return keyEl;
    }

    function renderLayer(layer, def) {
      const board = document.createElement("section");
      board.className = "board" + (layer.id === "f" ? " active" : "");

      const head = document.createElement("div");
      head.className = "board-head";
      const title = document.createElement("div");
      title.className = "board-title";
      title.textContent = `${layer.name}  ·  ${layer.trigger}`;
      const summary = document.createElement("div");
      summary.className = "board-summary";
      const bindings = layer.bindings || {};
      summary.textContent = Object.keys(bindings).length === 0
        ? "JIS 形状 · US 刻印"
        : Object.keys(bindings).sort().map((key) => `${displayName(key, def)}→${bindings[key]}`).join("   ");
      head.appendChild(title);
      head.appendChild(summary);
      board.appendChild(head);

      const keyboard = document.createElement("div");
      keyboard.className = "keyboard";
      def.rows.forEach((row, rowIndex) => {
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        const extras = (def.row_extras && def.row_extras[String(rowIndex)]) || [];
        for (const key of row) {
          rowEl.appendChild(createKey(key, layer, def));
          for (const extra of extras) {
            if (extra.after === key && !extra.placeholder) {
              rowEl.appendChild(createKey(extra.key, layer, def, { jisReturn: extra.key === "return" }));
            }
          }
        }
        keyboard.appendChild(rowEl);
      });
      board.appendChild(keyboard);

      const legend = document.createElement("div");
      legend.className = "legend";
      legend.innerHTML = `
        <span><i class="swatch holder"></i>レイヤーキー</span>
        <span><i class="swatch mapped"></i>リマップ</span>
        <span><i class="swatch normal"></i>通常</span>
      `;
      board.appendChild(legend);
      return board;
    }

    function main() {
      const def = window.__KEYMAP_LAYERS__;
      if (!def) throw new Error("window.__KEYMAP_LAYERS__ is missing");
      const root = document.getElementById("layers");
      root.replaceChildren();
      for (const layer of def.layers) root.appendChild(renderLayer(layer, def));
    }

    try { main(); }
    catch (error) {
      document.body.innerHTML = `<pre style="color:#ea6962;padding:24px;">failed to load keymap: ${error}</pre>`;
    }
  </script>
</body>
</html>
